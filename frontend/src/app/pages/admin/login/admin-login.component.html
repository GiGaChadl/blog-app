<div class="login-page">
  <div class="login-topbar">
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="login-card-container">
    <div class="login-header">
      <div class="brand-badge">
        <i class="pi pi-shield"></i>
      </div>
      <h2>Hệ Thống Quản Trị Blog</h2>
      <p>Vui lòng nhập thông tin đăng nhập để tiếp tục</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label for="username">Tài khoản</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-user"></i>
          <input
            pInputText
            id="username"
            type="text"
            formControlName="username"
            placeholder="Nhập tên đăng nhập"
            class="w-full"
            [class.ng-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          />
        </span>
        <small
          *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          class="p-error block"
        >
          Vui lòng nhập tên tài khoản.
        </small>
      </div>

      <div class="form-field">
        <label for="password">Mật khẩu</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-lock"></i>
          <input
            pInputText
            id="password"
            type="password"
            formControlName="password"
            placeholder="Nhập mật khẩu"
            class="w-full"
            [class.ng-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
        </span>
        <small
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="p-error block"
        >
          Mật khẩu tối thiểu 6 ký tự.
        </small>
      </div>

      <button
        pButton
        type="submit"
        label="Đăng Nhập"
        icon="pi pi-sign-in"
        class="w-full login-btn"
        [loading]="isLoading()"
      ></button>
    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link">
        <i class="pi pi-arrow-left"></i> Quay lại trang Blog
      </a>
    </div>
  </div>
</div>
